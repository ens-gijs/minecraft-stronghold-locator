<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Minecraft Stronghold Triangulator</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta name="description" content="Triangulate (locate) your Minecraft strongholds using Eye of Ender, F3+C (as of 1.13) and this easy to use web based tool.">
  <meta name="keywords" content="Minecraft,Stronghold,Eye of Ender,Locate,Find,F3 C,F3+C,Triangulate,Triangulation">

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-60P9F6P9HH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-60P9F6P9HH');
  </script>

  <!-- Pre-paint theme class to avoid flash. -->
  <script>
    (function(){
      var saved;
      try { saved = JSON.parse(localStorage.getItem('theme')); } catch(_){}
      var name = (saved === 'light' || saved === 'dark')
        ? saved
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', name);
    })();
  </script>

  <!-- Shared library (loaded from sibling GitHub Pages site) -->
  <script src="/common-lib/core/core.js"></script>
  <script src="/common-lib/core/observable.js"></script>
  <script src="/common-lib/math/numeric-1.2.6.min.js"></script>
  <script src="/common-lib/math/matrix.js"></script>
  <script src="/common-lib/math/vector.js"></script>
  <script src="/common-lib/drawing/drawing.js"></script>
  <script src="/common-lib/drawing/coordinate_plane.js"></script>
  <script src="/common-lib/drawing/canvas_helpers.js"></script>

  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply data-theme as a body class once body exists.
    document.addEventListener('DOMContentLoaded', function(){
      document.body.classList.add(document.documentElement.getAttribute('data-theme'));
    });
  </script>
</head>
<body>
<div class="canvas-container">
  <canvas id="board"></canvas>
  <div class="canvas-overlay">
    <div style="overflow:hidden;width:1px;height:1px;left:0;bottom:0;position:absolute">
      <textarea id="clipboard_buffer" style="display:inline-block;color:transparent;font-size:1px"></textarea>
    </div>
    <div class="overlay-footer">
      <span class="pos">
        <label for="overworld_pos">overworld</label>
        <div class="coords" id="overworld_pos">????, ????</div>
      </span>
      <span class="pos">
        <label for="nether_pos">nether</label>
        <div class="coords" id="nether_pos">????, ????</div>
      </span>
      <span class="pos draw-scale">
        <label for="zoom">zoom</label>
        <div class="coords" id="zoom">??:??</div>
      </span>
    </div>
  </div>
</div>
<div id="rightbar">
  <button id="sidebar_toggle" type="button" aria-label="Toggle sidebar">≡</button>
  <div class="inputs">
    <div>
      <label for="trig_input">Triangulation Inputs</label><br>
      <div class="input-caption">For instructions see the <a id="readme_link" href="https://github.com/ens-gijs/minecraft-stronghold-locator/blob/gh-pages/README.md" target="_blank" rel="noopener">Readme</a> on GitHub.</div>
    </div>
    <div>
      <textarea id="trig_input" spellcheck="false" autocapitalize="off" autocorrect="off">
-- Comments start with two dashes.
-- Double click the map to copy coords.
-- ALT + double click to copy NETHER coords.
-- Then paste those coords here to mark the spot.
#SteelBlue
7554 -2459 146.8
7622 -2591 142
7423 -3108 134.8

#Blue
6564 ~ -3947

-- these are were pasted (ctrl+v) after copying with F3+C in game
#DarkOrchid
/execute in overworld run tp @s -8839.15 69.00 -4709.39 115.29 -29.79
/execute in overworld run tp @s -9237.95 90.00 -5091.29 -1334.01 -31.06

#MediumSpringGreen
535 1754 -21.7
683 1696 -3.2
89 ~ 275 N

-- More Sample Colors
#SteelBlue
#Blue
#DarkOrchid
#Magenta
#MediumSpringGreen
#Orange
#DeepPink
#SlateBlue
#Lime
-- or you can just use RGB+Alpha
#rgba(255, 0, 127, 0.5)</textarea>
    </div>
    <div>
      <a id="web_color_link" href="https://en.wikipedia.org/wiki/Web_colors" target="_blank" rel="noopener">Web Colors</a>
      <button id="reset_view" class="button" type="button">Reset View</button>
      <button id="swap_theme" class="button" type="button">Swap Themes</button>
    </div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
